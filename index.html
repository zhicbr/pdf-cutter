<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线PDF切割工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">在线PDF切割工具</h1>

        <div class="mb-6">
            <div id="drop-zone" class="border-2 border-dashed border-blue-400 bg-blue-50 hover:bg-blue-100 rounded-lg p-10 text-center transition duration-300 cursor-pointer">
                <p class="text-gray-500 mb-2 text-lg" id="drop-hint">将PDF文件拖拽到此处，或点击选择文件</p>
                <p class="text-sm text-gray-400" id="file-name"></p>
                <input id="file-upload" type="file" class="hidden" accept=".pdf">
            </div>
        </div>

        <!-- 全屏拖拽覆盖层 -->
        <div id="drop-overlay" class="fixed inset-0 bg-blue-500/15 backdrop-blur-[2px] flex items-center justify-center z-50 hidden pointer-events-none">
            <div class="bg-white rounded-2xl p-14 border-4 border-dashed border-blue-500 shadow-2xl text-center">
                <p class="text-3xl font-bold text-blue-600 mb-2">📄 释放文件以上传</p>
                <p class="text-gray-400 text-lg">支持 PDF 格式</p>
            </div>
        </div>

        <!-- 页码范围列表 -->
        <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
                <label class="text-gray-700 font-semibold">页码范围</label>
                <button id="add-range" class="text-blue-500 hover:text-blue-600 text-sm font-medium transition duration-200">+ 添加范围</button>
            </div>
            <div id="ranges-container" class="space-y-2"></div>
        </div>

        <!-- 提示 -->
        <p class="text-xs text-gray-400 mb-6">相同「合并组」的范围将合并为一个文件，留空则单独输出。合并顺序按原始页码先后排列。</p>

        <button id="split-button" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition duration-300 disabled:bg-gray-400" disabled>
            开始切割
        </button>

        <div id="status" class="mt-4 text-center text-gray-600"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
